services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-docs-chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdocs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdocs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
